<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ТЕСТ КОНТАКТОВ - Москва 2000 бань</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        .status {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 30px;
        }
        .success { color: #27ae60; font-weight: bold; }
        .error { color: #e74c3c; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            border: 2px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102,126,234,0.2);
        }
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .info {
            margin: 8px 0;
            color: #555;
            font-size: 0.95rem;
        }
        .phone {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .email {
            color: #764ba2;
            font-size: 0.9rem;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            font-size: 0.85rem;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 ТЕСТ КОНТАКТОВ</h1>
        <div class="status" id="status">Загрузка...</div>
        <div class="grid" id="grid"></div>
    </div>

    <script type="module">
        try {
            // Импортируем данные
            const { baths } = await import('./src/data/cities/moskva.js');
            
            console.log('✅ Данные загружены!');
            console.log('📊 Всего бань:', baths.length);
            console.log('📋 Первая баня:', baths[0]);
            
            // Проверка
            const withPhone = baths.filter(b => b.phone).length;
            const withEmail = baths.filter(b => b.email).length;
            
            const statusHTML = `
                <span class="success">✅ ДАННЫЕ ЗАГРУЖЕНЫ!</span><br>
                <strong>Всего бань:</strong> ${baths.length.toLocaleString('ru-RU')}<br>
                <strong>С телефонами:</strong> ${withPhone} (${((withPhone/baths.length)*100).toFixed(0)}%)<br>
                <strong>С email:</strong> ${withEmail} (${((withEmail/baths.length)*100).toFixed(0)}%)<br>
                <br>
                Показываю первые 20 бань:
            `;
            
            document.getElementById('status').innerHTML = statusHTML;
            
            // Показываем первые 20
            const grid = document.getElementById('grid');
            
            baths.slice(0, 20).forEach((bath, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <h3>${bath.name}</h3>
                    ${bath.types.map(t => `<span class="badge">${t}</span>`).join('')}
                    <div class="info">📍 ${bath.address}</div>
                    <div class="info phone">📞 ${bath.phone}</div>
                    ${bath.email ? `<div class="info email">📧 ${bath.email}</div>` : ''}
                    <div class="info">💰 ${bath.price}</div>
                    <div class="info">⭐ ${bath.rating} • ${bath.reviews} отзывов</div>
                `;
                
                grid.appendChild(card);
            });
            
        } catch (error) {
            console.error('❌ ОШИБКА:', error);
            document.getElementById('status').innerHTML = `
                <span class="error">❌ ОШИБКА ЗАГРУЗКИ!</span><br>
                ${error.message}<br><br>
                Открой консоль (F12) для подробностей
            `;
        }
    </script>
</body>
</html>
